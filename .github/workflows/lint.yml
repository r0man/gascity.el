name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Emacs 31.1
        uses: purcell/setup-emacs@master
        with:
          version: '31.1'

      - name: Cache Eldev dependencies
        uses: actions/cache@v4
        with:
          path: ~/.emacs.d/eldev
          key: ${{ runner.os }}-eldev-lint-v1-${{ hashFiles('Eldev') }}
          restore-keys: |
            ${{ runner.os }}-eldev-lint-v1-

      - name: Install Eldev
        run: curl --fail --silent --show-error --location https://raw.github.com/doublep/eldev/master/webinstall/github-eldev | sh

      # gc v1.4.2 from gastownhall/gascity.  Not strictly needed for lint,
      # but kept so lint-adjacent Elisp gating on (executable-find "gc")
      # sees the same environment as the test workflow.  Bump by changing
      # the version in the URL.
      - name: Install Gascity v1.4.2
        run: |
          curl -fsSL https://github.com/gastownhall/gascity/releases/download/v1.4.2/gascity_1.4.2_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin gc
          gc version

      - name: Lint
        run: eldev -p -dtT lint
