name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The lint bar is `make lint`: scripts/lint.el runs checkdoc over every
# lisp/*.el and then package-lint under Emacs 31.1, and any finding is fatal
# (REQ-008).  Eldev is not installed; scripts/ci-deps installs transient, vui
# and package-lint into a throwaway directory and exports a trailing-colon
# EMACSLOADPATH, so the linter sees the dependencies without clobbering
# Emacs's own lisp directory (checkdoc, simple.el).  This matches what
# `scripts/lint.sh` wraps locally.

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Emacs 31.1
        uses: purcell/setup-emacs@master
        with:
          version: '31.1'

      # `configure` hard-requires makeinfo even though lint never builds the
      # manual, because the build is configured the same way the other jobs
      # configure it.
      - name: Install Texinfo
        run: sudo apt-get update && sudo apt-get install -y texinfo

      # Same non-ELPA dependency resolution as the test workflow (OQ-1):
      # beads.el from the canonical checkout, and the pinned vui release
      # beside it for configure's sibling default.
      - name: Clone beads.el (sibling dependency)
        run: |
          git clone --depth 1 https://github.com/r0man/beads.el.git "$HOME/workspace/beads.el"
          git -C "$HOME/workspace/beads.el" rev-parse --short HEAD

      - name: Clone vui.el (beads.el dependency)
        run: |
          git clone --depth 1 --branch v1.4.0 https://github.com/d12frosted/vui.el.git "$HOME/workspace/vui"
          git -C "$HOME/workspace/vui" rev-parse --short HEAD

      # gc v1.4.2 from gastownhall/gascity.  Not strictly needed for lint,
      # but kept so lint-adjacent Elisp gating on (executable-find "gc")
      # sees the same environment as the test workflow.  Bump by changing
      # the version in the URL.
      - name: Install Gascity v1.4.2
        run: |
          curl -fsSL https://github.com/gastownhall/gascity/releases/download/v1.4.2/gascity_1.4.2_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin gc
          gc version

      # transient (a build/runtime dependency), vui and package-lint are
      # installed into a throwaway package directory and handed to the build
      # as a trailing-colon EMACSLOADPATH, so checkdoc and simple.el still
      # resolve from Emacs's own lisp directory (REQ-008, plan D3).
      - name: Install Elisp dependencies
        run: |
          deps=$(scripts/ci-deps transient vui package-lint)
          echo "EMACSLOADPATH=$deps" >> "$GITHUB_ENV"

      - name: Bootstrap and configure
        run: |
          ./autogen.sh
          ./configure --with-beads-dir="$HOME/workspace/beads.el"

      # scripts/lint.el `require`s package-lint from the EMACSLOADPATH that
      # ci-deps exported; findings are fatal.
      - name: Lint
        run: make lint
